<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bio-Stack Builder</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        background:#f4f4f4;
        color:#222;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
        transition:0.3s;
    }

    body.dark{
        background:#111827;
        color:white;
    }

    .container{
        width:100%;
        max-width:420px;
        background:white;
        padding:25px;
        border-radius:20px;
        box-shadow:0 5px 20px rgba(0,0,0,0.1);
        transition:0.3s;
    }

    body.dark .container{
        background:#1f2937;
    }

    .profile{
        text-align:center;
        margin-bottom:20px;
    }

    .profile img{
        width:90px;
        height:90px;
        border-radius:50%;
        object-fit:cover;
        border:3px solid #2563eb;
    }

    .profile h2{
        margin-top:10px;
    }

    .theme-toggle{
        margin-top:10px;
        padding:10px 15px;
        border:none;
        background:#2563eb;
        color:white;
        border-radius:10px;
        cursor:pointer;
    }

    .form{
        margin-top:20px;
    }

    .form input{
        width:100%;
        padding:12px;
        margin-bottom:12px;
        border:1px solid #ccc;
        border-radius:10px;
        outline:none;
    }

    body.dark .form input{
        background:#374151;
        color:white;
        border:none;
    }

    .form button{
        width:100%;
        padding:12px;
        border:none;
        background:#10b981;
        color:white;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
    }

    .error{
        color:red;
        margin-bottom:10px;
        text-align:center;
        font-size:14px;
    }

    .links{
        margin-top:25px;
    }

    .link-card{
        display:flex;
        justify-content:space-between;
        align-items:center;
        background:#f3f4f6;
        padding:12px;
        border-radius:12px;
        margin-bottom:12px;
        transition:0.3s;
    }

    body.dark .link-card{
        background:#374151;
    }

    .link-info{
        width:80%;
    }

    .link-info a{
        text-decoration:none;
        color:#2563eb;
        word-break:break-word;
    }

    .delete-btn{
        border:none;
        background:red;
        color:white;
        padding:8px 12px;
        border-radius:8px;
        cursor:pointer;
    }

    @media(max-width:500px){
        .container{
            padding:18px;
        }

        .profile h2{
            font-size:22px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="profile">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="">
        <h2>Creator Bio-Stack</h2>
        <p>Manage your social links</p>

        <button class="theme-toggle" id="themeBtn">
            Toggle Dark Mode
        </button>
    </div>

    <div class="form">
        <div class="error" id="error"></div>

        <input type="text" id="title" placeholder="Enter Platform Name">
        <input type="text" id="url" placeholder="Enter URL">

        <button id="addBtn">Add Link</button>
    </div>

    <div class="links" id="linksContainer"></div>

</div>

<script>
    const titleInput = document.getElementById("title");
    const urlInput = document.getElementById("url");
    const addBtn = document.getElementById("addBtn");
    const linksContainer = document.getElementById("linksContainer");
    const error = document.getElementById("error");
    const themeBtn = document.getElementById("themeBtn");

    // Load Data
    let links = JSON.parse(localStorage.getItem("bioLinks")) || [];

    // Render Links
    function renderLinks(){
        linksContainer.innerHTML = "";

        if(links.length === 0){
            linksContainer.innerHTML = `
                <p style="text-align:center;">No links added</p>
            `;
            return;
        }

        links.forEach((link, index) => {

            const div = document.createElement("div");
            div.className = "link-card";

            div.innerHTML = `
                <div class="link-info">
                    <h4>${link.title}</h4>
                    <a href="${link.url}" target="_blank">
                        ${link.url}
                    </a>
                </div>

                <button class="delete-btn" onclick="deleteLink(${index})">
                    Delete
                </button>
            `;

            linksContainer.appendChild(div);
        });

        localStorage.setItem("bioLinks", JSON.stringify(links));
    }

    // URL Validation
    function isValidURL(url){
        try{
            new URL(url);
            return true;
        }catch{
            return false;
        }
    }

    // Add Link
    addBtn.addEventListener("click", () => {

        const title = titleInput.value.trim();
        const url = urlInput.value.trim();

        error.innerText = "";

        if(title === "" || url === ""){
            error.innerText = "All fields are required!";
            return;
        }

        if(!isValidURL(url)){
            error.innerText = "Please enter a valid URL!";
            return;
        }

        links.push({
            title,
            url
        });

        renderLinks();

        titleInput.value = "";
        urlInput.value = "";
    });

    // Delete Link
    function deleteLink(index){
        links.splice(index, 1);
        renderLinks();
    }

    // Theme Toggle
    themeBtn.addEventListener("click", () => {

        document.body.classList.toggle("dark");

        if(document.body.classList.contains("dark")){
            localStorage.setItem("theme", "dark");
        }else{
            localStorage.setItem("theme", "light");
        }
    });

    // Load Theme
    const savedTheme = localStorage.getItem("theme");

    if(savedTheme === "dark"){
        document.body.classList.add("dark");
    }

    renderLinks();
</script>

</body>
</html>
